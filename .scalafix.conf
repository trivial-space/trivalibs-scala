// Import organization, applied by Metals on save via the `source.organizeImports`
// code action (see .vscode/settings.json) and runnable repo-wide with scalafix.
//
// Without this file Metals synthesizes its own config (rule + targetDialect +
// removeUnused) and leaves everything else at scalafix's defaults. The values
// below ARE those defaults, written down so the layout is pinned to the repo
// rather than to whatever version of Metals happens to be installed.
rules = [OrganizeImports]

OrganizeImports {
  targetDialect = Scala3

  // Two groups: everything first, `scala.*` last, separated by a blank line.
  // This is why `scala.scalajs.js.annotation.JSExportTopLevel` sits at the
  // bottom of every sketch.
  //
  // Scalafix's default regex is `re:(javax?|scala)\.`; the java half is dropped
  // because this project targets JS platforms only and never imports from the
  // JVM standard library. What is left in that group is `scala.scalajs.*` —
  // the Scala.js interop we cannot avoid — and the handful of compile-time
  // constructs (`scala.NamedTuple`, `scala.compiletime`) that erase completely.
  groups = ["*", "re:scala\\."]
  importsOrder = Ascii
  importSelectorsOrder = Ascii

  // One import per symbol — `Hash` and `Simplex` stay on their own lines
  // instead of being merged into `random.{Hash, Simplex}`.
  groupedImports = Explode

  // Deleting imports needs the compiler to report them as unused, which needs
  // `-Wunused` in project.scala. It isn't set, so this stays off: a wildcard
  // prelude import must never be dropped on a save because a file happens not
  // to name anything from it.
  removeUnused = false
}
