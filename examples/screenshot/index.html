<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot - Scala WebGPU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    canvas {
      width: 800px;
      height: 450px;
      border: 2px solid #4a4a6a;
      border-radius: 4px;
    }

    button {
      padding: 0.5rem 1rem;
      background: #4a4a6a;
      color: #ddddee;
      border: none;
      border-radius: 4px;
      font-size: 0.875rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #status {
      color: #8888aa;
      font-size: 0.875rem;
    }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #8888aa;
      text-decoration: none;
    }

    .back-link:hover {
      color: #aaaacc;
    }
  </style>
</head>

<body>
  <a href="/" class="back-link">&larr; Back to examples</a>
  <div id="container">
    <canvas id="canvas"></canvas>
    <button id="shot">4K screenshot</button>
    <div id="status">Downloads a 3840×2160 PNG while the canvas keeps rendering</div>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
